# ============================================================
# application-prod.properties — Perfil de PRODUCCIÓN
#
# Activo cuando: SPRING_PROFILES_ACTIVE=prod
# ============================================================

# ── Logging mínimo ────────────────────────────────────────────
logging.level.root=ERROR
logging.level.ec.espe.votacion_segura_backend=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.flywaydb=WARN

# ── Sin SQL en logs ───────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── OTP NUNCA en logs ─────────────────────────────────────────
app.otp.log-code-dev=false

# ── Sin stack traces en respuestas HTTP ───────────────────────
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ── Swagger deshabilitado en producción ──────────────────────
# Recomendado deshabilitarlo o protegerlo con autenticación adicional
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Actuator: solo health y info (sin métricas detalladas) ───
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
