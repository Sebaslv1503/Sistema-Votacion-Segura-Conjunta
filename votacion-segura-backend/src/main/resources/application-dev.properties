# ============================================================
# application-dev.properties — Perfil de DESARROLLO
#
# Activo cuando: SPRING_PROFILES_ACTIVE=dev
# NUNCA usar en producción.
#
# DIFERENCIAS con producción:
#   - OTP visible en logs (modo dev)
#   - SQL visible en logs
#   - Mailpit en localhost para capturar correos
#   - Swagger disponible sin autenticación
#   - Stack traces completos en respuestas de error
# ============================================================

# Spring Boot no lee archivos dotenv por defecto. Carga el .env local únicamente
# en este perfil; en producción se usan las variables de entorno del despliegue.
spring.config.import=optional:file:.env[.properties]

# ── Logging extendido para desarrollo ────────────────────────
logging.level.ec.espe.votacion_segura_backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ── Mostrar SQL con parámetros (SOLO DESARROLLO) ─────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── OTP en log de desarrollo ──────────────────────────────────
# En producción, este flag NO existe y el OTP NUNCA aparece en log.
# En desarrollo, permite verificar el flujo sin servidor SMTP real.
app.otp.log-code-dev=true

# ── Mailpit (capturador SMTP local para desarrollo) ───────────
# docker run -d -p 1025:1025 -p 8025:8025 axllent/mailpit
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# ── Stack traces en respuestas de error (SOLO DESARROLLO) ─────
server.error.include-stacktrace=on-param
server.error.include-message=always

# ── Swagger accesible sin credenciales adicionales ───────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ── Credenciales JWT para desarrollo (solo si no hay .env) ───
# app.jwt.secret=dev-secret-debe-ser-cambiado-en-produccion-256bits-minimo
# ↑ Descomenta SOLO si no usas .env en desarrollo local
