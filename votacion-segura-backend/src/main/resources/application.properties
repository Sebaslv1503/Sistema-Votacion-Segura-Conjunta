# ============================================================
# application.properties — Configuración base del sistema de votación
#
# SEGURIDAD:
#   - Ningún valor sensible se escribe aquí.
#   - Todos los secrets se leen desde variables de entorno.
#   - Para desarrollo local, crear un archivo .env en la raíz
#     (ver .env.example).
# ============================================================

spring.application.name=votacion-segura-backend

# ── Perfil activo (override por variable de entorno) ─────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Base de datos: conexión de la APLICACIÓN (runtime) ───────
# Flyway usa una datasource separada (ver FlywayConfig.java)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:votacion_segura_db}
spring.datasource.username=${DB_APP_USER:votacion_app}
spring.datasource.password=${DB_APP_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.pool-name=VotacionPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ───────────────────────────────────────────
# validate: Hibernate verifica que el esquema coincide con las entidades.
# Flyway gestiona el DDL; Hibernate NUNCA lo modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ── Flyway: ejecuta con usuario de migración ──────────────────
# La datasource de Flyway se configura en FlywayConfig.java
# con las credenciales de votacion_migra (propietario de tablas)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
# URL de la datasource de Flyway (usuario con permisos de DDL)
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:votacion_segura_db}
spring.flyway.user=${DB_MIGRA_USER:votacion_migra}
spring.flyway.password=${DB_MIGRA_PASSWORD}

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:28800000}

# ── Credencial de voto ────────────────────────────────────────
app.credencial.expiracion-minutos=${CREDENCIAL_EXPIRACION_MINUTOS:30}

# ── OTP ──────────────────────────────────────────────────────
app.otp.expiracion-minutos=${OTP_EXPIRACION_MINUTOS:10}
app.otp.max-intentos=${OTP_MAX_INTENTOS:5}

# ── Seguridad ─────────────────────────────────────────────────
app.security.max-intentos-login=${SECURITY_MAX_INTENTOS_LOGIN:5}
app.security.bloqueo-minutos=${SECURITY_BLOQUEO_MINUTOS:15}

# ── CORS ──────────────────────────────────────────────────────
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# ── Correo electrónico ────────────────────────────────────────
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:noreply@votacion.dev}

# ── Swagger / Springdoc OpenAPI ───────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

# Información de la aplicación
info.app.name=Sistema de Votación Segura
info.app.version=0.0.1-SNAPSHOT
info.app.description=Backend API REST para elecciones internas de asociación profesional

# ── Logging ────────────────────────────────────────────────────
# NUNCA usar TRACE en producción (expone datos sensibles)
logging.level.root=WARN
logging.level.ec.espe.votacion_segura_backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
# Patrón sin stack trace completo en respuestas HTTP (producción)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Jackson ────────────────────────────────────────────────────
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
