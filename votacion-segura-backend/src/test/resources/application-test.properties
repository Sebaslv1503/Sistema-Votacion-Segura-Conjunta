# Isolated test database. These values intentionally do not inherit PostgreSQL env vars.
spring.datasource.url=jdbc:h2:mem:votacion_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
app.jwt.secret=test-only-secret-that-is-long-enough-for-local-tests-1234567890
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=28800000
app.credencial.expiracion-minutos=30
app.otp.expiracion-minutos=10
app.otp.max-intentos=5
app.security.max-intentos-login=5
app.security.bloqueo-minutos=15
app.cors.allowed-origin=http://localhost:3000
app.mail.from=test@example.invalid
spring.mail.host=localhost
spring.mail.port=1025
